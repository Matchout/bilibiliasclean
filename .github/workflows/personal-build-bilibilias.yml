name: personal-build-bilibilias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/personal-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            printf '%s' "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/mxjs-debug.jks"
            SIZE=$(stat -c%s "$RUNNER_TEMP/mxjs-debug.jks")
            echo "keystore ready: ${SIZE} bytes"
          else
            echo "::warning::KEYSTORE_B64 not set -> fallback to debug signing"
          fi

      - name: Apply cleanup + patches
        run: |
          set -euo pipefail
          python3 --version
          test -f tools/cleanup.py
          python3 tools/cleanup.py

      - name: Show patch footprint
        run: |
          set -euo pipefail
          git --no-pager diff --stat > "$RUNNER_TEMP/footprint.txt"
          tail -40 "$RUNNER_TEMP/footprint.txt"
          echo "----- status (total lines) -----"
          git status --short > "$RUNNER_TEMP/status.txt"
          wc -l < "$RUNNER_TEMP/status.txt"
          echo "----- status (first 40) -----"
          head -40 "$RUNNER_TEMP/status.txt"

      - name: Build alpha release (arm64 only)
        env:
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:assembleAlphaRelease --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          ls -1 app/build/outputs/apk/alpha/release/ > "$RUNNER_TEMP/apks.txt"
          cat "$RUNNER_TEMP/apks.txt"
          APK="app/build/outputs/apk/alpha/release/$(head -1 "$RUNNER_TEMP/apks.txt")"
          echo "APK = $APK"
          ls -l "$APK"

          unzip -l "$APK" > "$RUNNER_TEMP/apklist.txt"
          echo "----- native lib ABI -----"
          grep -E 'lib/[^/]+/' "$RUNNER_TEMP/apklist.txt" | awk '{print $4}' | cut -d/ -f1-2 | sort -u

          if grep -q 'lib/x86_64/' "$RUNNER_TEMP/apklist.txt"; then
            echo "::error::APK still contains x86_64 native libs"
            exit 1
          fi
          if grep -q 'lib/arm64-v8a/' "$RUNNER_TEMP/apklist.txt"; then
            echo "arm64-v8a OK"
          fi

          echo "----- signature -----"
          find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -name apksigner -type f > "$RUNNER_TEMP/signers.txt" 2>/dev/null || true
          APKSIGNER=$(tail -1 "$RUNNER_TEMP/signers.txt")
          if [ -n "${APKSIGNER}" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt" 2>&1 || true
            head -6 "$RUNNER_TEMP/certs.txt"
          else
            echo "apksigner not found, skip"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibilias-alpha-arm64
          path: app/build/outputs/apk/alpha/release/*.apk
          if-no-files-found: error