name: personal-build-bilibilias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/personal-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            printf '%s' "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/mxjs-debug.jks"
            SIZE=$(stat -c%s "$RUNNER_TEMP/mxjs-debug.jks")
            echo "keystore ready: ${SIZE} bytes"
          else
            echo "::warning::KEYSTORE_B64 not set -> fallback to debug signing"
          fi

      - name: Apply cleanup + patches
        run: |
          set -euo pipefail
          python3 --version
          test -f tools/cleanup.py
          python3 tools/cleanup.py

      - name: Show patch footprint
        run: |
          set -euo pipefail
          git --no-pager diff --stat | tail -40
          echo "----- status -----"
          git status --short | head -40

      - name: Build alpha release (arm64 only)
        env:
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:assembleAlphaRelease --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/alpha/release/*.apk | head -1)
          echo "APK = $APK"
          ls -l "$APK"
          echo "----- native lib ABI -----"
          unzip -l "$APK" | grep -E 'lib/[^/]+/' | awk '{print $4}' | cut -d/ -f1-2 | sort -u
          if unzip -l "$APK" | grep -q 'lib/x86_64/'; then
            echo "::error::APK still contains x86_64 native libs"
            exit 1
          fi
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "arm64-v8a OK"
          fi
          echo "----- signature -----"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "${APKSIGNER}" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -6
          else
            echo "apksigner not found, skip"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibilias-alpha-arm64
          path: app/build/outputs/apk/alpha/release/*.apk
          if-no-files-found: error
